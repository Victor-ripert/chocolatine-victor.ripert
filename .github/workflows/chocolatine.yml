name:   Chocolatine
run-name: ${{ github.actor }} -> Chocolatine is running on ${{ github.repository }}
on: [push, pull_request]
env:
  EXECUTABLES: "a.out,my_segfault,mysh"
jobs:
    check_coding_style:
      if: github.repository != 'EpitechPGEPromo2029/B-DOP-200-PAR-2-1-chocolatine-victor.ripert' && !startsWith(github.repository, 'ga-ignore-')
      runs-on: ubuntu-latest
      container:
        image: ghcr.io/epitech/coding-style-checker:latest
      steps:
        - name: Checkout
          uses: actions/checkout@v4
          with:
            fetch-depth: 0
        - name: execute check.sh
          run: check.sh $(pwd) $(pwd)
        - name: parse and display coding-style-reports.log
          run : |
            python3 - <<EOF
            with open("coding-style-reports.log", "r") as file :
              for line in file:
                  info = line.split(":")
            EOF
        - name: remove coding-style-reports.log
          run : rm coding-style-reports.log
    check_compilation:
      needs: check_coding_style
      runs-on: ubuntu-latest
      container:
        image: epitechcontent/epitest-docker:latest
      steps:
        - name: Checkout
          uses: actions/checkout@v4
          with:
            fetch-depth: 0
        - name: make
          run: make
          timeout-minutes: 2
        - name: clean
          run: make clean
        - name: check_binary
          run: |
            variable=$EXECUTABLE
            echo $variable
            for filename in ${variable//,/ }; do
            if ! test -e "$file_name"; then
            echo "file doesn't exists."
            fi
            echo "file exist"
            done